; ESP32 firmware for the HUB75 panel, see ../README.md
[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
lib_deps = mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.12
; SERIAL_BAUD must match `spectrum --baud`. 921600 is the most a classic CP2102 does (about 22 fps);
; CP2102N and CH340 bridges take 2000000 for the full frame rate
; panel tuning, if the boot bars look wrong: -DPANEL_DRIVER=FM6126A (or ICN2038S),
; -DPANEL_LINE_DECODER=SM5266P (or TYPE595), -DPANEL_CLKPHASE=0
; other wiring than the library defaults (order R1,G1,B1,R2,G2,B2,A,B,C,D,E,LAT,OE,CLK; -1 = unused):
;   -DPANEL_PINS=25,26,27,14,12,13,23,19,5,17,-1,4,15,16
build_flags = -DNO_GFX -DSERIAL_BAUD=921600
monitor_speed = 921600

[env:esp32dev]
board = esp32dev
upload_speed = 921600

; Tidbyt v1 (ESP32-D0WD-V3, 8 MB, CP2102N): `pio run -e tidbyt -t upload`, then `spectrum --baud 2000000`.
; Pin map from tronbyt/firmware-esp32; if the boot bars are not red, green, blue, the unit is the
; colour-swapped variant: -DPANEL_PINS=21,2,22,23,4,27,26,5,25,18,-1,19,32,33
; The panel is fed from the same USB port, hence the brightness cap (Tronbyt uses the same 100)
[env:tidbyt]
board = esp32dev
upload_speed = 921600
monitor_speed = 2000000
build_flags =
    -DNO_GFX
    -DSERIAL_BAUD=2000000
    -DPANEL_PINS=2,22,21,4,27,23,26,5,25,18,-1,19,32,33
    -DPANEL_MAX_BRIGHTNESS=100

; Office: four 64x32 modules turned 90 degrees and side by side, every second one upside down
; because the chain cable is short, 128x64 all in all. The ESP feeds the leftmost module, which
; is the virtual panel's top row; the picture is turned 3 quarter turns onto it.
; Whole picture upside down: PANEL_ROTATE=1 with CHAIN_TOP_RIGHT_DOWN. Every module upside
; down but in the right order: swap LEFT and RIGHT in CHAIN_TYPE.
; A frame is 16 KB, so the CP2102's 921600 baud gives ~5 fps; a 2 Mbaud bridge ~12.
; -DPANEL_COLOR_DEPTH=6 if the panel stays dark (DMA memory).
[env:office]
board = esp32dev
upload_speed = 921600
build_flags =
    ${env.build_flags}
    -DPANEL_W=128 -DPANEL_H=64
    -DMODULE_W=64 -DMODULE_H=32 -DCHAIN_ROWS=4 -DCHAIN_COLS=1
    -DCHAIN_TYPE=CHAIN_TOP_LEFT_DOWN -DPANEL_ROTATE=3

; native USB CDC, the baud rate is irrelevant
[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
