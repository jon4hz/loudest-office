; ESP32 firmware for the HUB75 panel, see ../README.md
[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
lib_deps = mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.12
; SERIAL_BAUD must match `spectrum --baud`. 921600 is the most a classic CP2102 does (about 22 fps);
; CP2102N and CH340 bridges take 2000000 for the full frame rate
; panel tuning, if the boot bars look wrong: -DPANEL_DRIVER=FM6126A (or ICN2038S),
; -DPANEL_LINE_DECODER=SM5266P (or TYPE595), -DPANEL_CLKPHASE=0
; other wiring than the library defaults (order R1,G1,B1,R2,G2,B2,A,B,C,D,E,LAT,OE,CLK; -1 = unused):
;   -DPANEL_PINS=25,26,27,14,12,13,23,19,5,17,-1,4,15,16
build_flags = -DNO_GFX -DSERIAL_BAUD=921600
monitor_speed = 921600

[env:esp32dev]
board = esp32dev
upload_speed = 921600

; native USB CDC, the baud rate is irrelevant
[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
