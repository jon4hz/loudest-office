---
- name: Restart compose service
  ansible.builtin.systemd_service:
    name: compose.service
    scope: user
    daemon_reload: true
    state: restarted
  listen: restart_compose_service
  become: true
  become_user: "{{ podman_compose_user.name }}"

- name: Restart user manager
  ansible.builtin.systemd_service:
    name: user@{{ podman_compose_user.uid }}.service
    state: restarted
  listen: restart_user_manager
