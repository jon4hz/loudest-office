---
- name: Key-based ssh for {{ ansible_user }}
  when: base_ssh_authorized_keys | length > 0
  block:
    - name: Authorize ssh keys
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ base_ssh_authorized_keys | join('\n') }}"

    - name: Disable ssh password login
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/50-ansible.conf
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
        mode: "0644"
      notify: reload_sshd

- name: Allow passwordless sudo for {{ ansible_user }}
  ansible.builtin.copy:
    dest: /etc/sudoers.d/50-{{ ansible_user }}
    content: "{{ ansible_user }} ALL=(ALL) NOPASSWD: ALL\n"
    mode: "0440"
    validate: visudo -cf %s
