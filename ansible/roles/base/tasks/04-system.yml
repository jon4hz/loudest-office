---
- name: Create journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Cap journald disk usage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/50-size.conf
    content: |
      [Journal]
      SystemMaxUse={{ base_journald_max_use }}
    mode: "0644"
  notify: restart_journald
