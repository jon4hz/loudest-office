---
- name: Configure the loudest office raspi
  hosts: raspi
  become: true
  roles:
    - role: base
      tags: [base]
      vars:
        base_firewall_allow:
          - { port: 22, proto: tcp } # ssh
          - { port: 5353, proto: udp } # mDNS
          - { port: 8095, proto: tcp } # music assistant web ui
          - { port: 8097, proto: tcp } # music assistant stream server
          - { port: "32768:60999", proto: tcp } # spotify connect zeroconf handshake
          # airplay receiver (shairport-sync in music assistant, classic airplay): one rtsp
          # port per player, 7000 + hash, and the udp_port_base/udp_port_range defaults
          - { port: "7000:7999", proto: tcp } # airplay rtsp
          - { port: "6001:6010", proto: udp } # airplay audio, control and timing
          - { port: 80, proto: tcp } # caddy http -> https redirect
          - { port: 443, proto: tcp } # caddy https reverse proxy
          - { port: 8123, proto: tcp } # home assistant
          - { port: 8443, proto: tcp } # caddy https: tronbyt server web ui

    - role: access_point
      tags: [access_point]

    - role: hifiberry
      tags: [hifiberry]

    - role: music_assistant
      tags: [music_assistant]

    - role: home_assistant
      tags: [home_assistant]

    - role: tronbyt
      tags: [tronbyt]

    - role: esphome
      tags: [esphome]

    - role: caddy
      tags: [caddy]
      vars:
        caddy_sites:
          - { host: "{{ ansible_host }}", to: "127.0.0.1:8123" } # home assistant
          - { host: loudestoffice-ma.local, to: "127.0.0.1:8095" } # music assistant
          # tronbyt, behind the home assistant login and framed by it
          - host: "{{ ansible_host }}:8443"
            to: "127.0.0.1:8000"
            ha_ingress: tronbyt
            ha_origin: "https://{{ ansible_host }}"

    - role: visualizer
      tags: [visualizer]
